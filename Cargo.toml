[package]
name = "evolve-tv"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "x11", "default_fonts"] }
egui-phosphor = "0.14"
image = { version = "0.25.10", default-features = false, features = ["gif", "png", "webp"] }
keyring-core = "1"
raw-window-handle = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
webpki-roots = "1"
x11rb = "0.13"
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

# Build profile optimised for a small, RAM-frugal binary.
[profile.release]
opt-level = 3       # optimisation maximale de la vitesse
lto = true          # optimisation sur l'ensemble du programme (binaire plus petit)
codegen-units = 1   # compilation plus lente mais code plus compact
strip = true        # retire les symboles de débogage du binaire final
